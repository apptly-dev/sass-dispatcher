# cSpell:words sass
# TODO: set account_id before deploying.
# account_id = ""
name = "sass-dispatcher"
main = "src/index.ts"
# Pinned to the workerd shipped by @cloudflare/vitest-pool-workers'
# bundled wrangler; raise alongside that dep when it ships a newer
# miniflare.
compatibility_date = "2026-03-17"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_tty_module",
  "enable_nodejs_fs_module",
  "enable_nodejs_http_modules",
  "enable_nodejs_perf_hooks_module",
  "enable_nodejs_v8_module",
  "enable_nodejs_process_v2",
]

# TAISTAMP_SECRETS signs /.well-known/taistamp responses.
# Holds one or more `selector:base64` secrets separated by
# whitespace, commas, semicolons, pipes, etc.; the last
# entry signs, leading entries are reserved for rotation.
# Absent / empty falls through to unsigned labels.
#
# Setting it depends on the upload path:
#  - `wrangler deploy`: `wrangler secret put TAISTAMP_SECRETS`.
#  - Workers Builds (CI): a secret-typed dashboard build
#    variable. A plain-text variable re-binds an empty
#    string on every `versions upload` and displaces any
#    per-version `secret put`.

[dev]
ip = "0.0.0.0"

# Service bindings — delegate apptly.co traffic to the
# apptly-website worker via the `service` dispatcher rule.
# The target worker must be deployed under that exact name
# in the same account.
[[services]]
binding = "APPTLY_WEBSITE"
service = "apptly-website"

# Bindings (D1, KV, R2) go here as the dispatcher grows.
